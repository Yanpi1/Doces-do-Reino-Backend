# ============================================
#  IGREJA DO REINO — CONFIG DO BACKEND JAVA
#  Tudo lido de variaveis de ambiente (docker-compose.yml),
#  com fallback para os valores padrao do ambiente local.
# ============================================

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Chave da API Google Gemini, usada pelo /api/chat-proxy.php
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-1.5-flash

# Garante UTF-8 correto nas respostas JSON
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.jackson.default-property-inclusion=non_null
